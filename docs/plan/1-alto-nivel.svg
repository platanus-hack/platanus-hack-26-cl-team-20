<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1000" viewBox="0 0 1680 1000" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>pcx · plan de alto nivel (sáb 21-nov, 18:00)</title>
  <defs>
    <marker id="a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#50555E"/>
    </marker>
    <marker id="as" viewBox="0 0 12 12" refX="1" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M11 1 L1 6 L11 11 Z" fill="#50555E"/>
    </marker>
    <style>
      .t{font-size:20px;fill:#1d1f23}
      .b{font-size:22px;font-weight:700;fill:#1d1f23}
      .s{font-size:17px;fill:#495057}
      .lbl{font-size:17px;fill:#1d1f23}
      .h{font-size:20px;font-weight:700;fill:#343A40;letter-spacing:.5px}
      .ln{stroke:#50555E;stroke-width:2;fill:none}
      .dot{stroke:#50555E;stroke-width:2;fill:none;stroke-dasharray:6 6}
      .manu{fill:#FFE8CC;stroke:#E8590C;stroke-width:2.5}
      .daniel{fill:#D0EBFF;stroke:#1971C2;stroke-width:2.5}
      .max{fill:#D3F9D8;stroke:#2F9E44;stroke-width:2.5}
      .pm{fill:#F3D9FA;stroke:#9C36B5;stroke-width:2.5}
      .ext{fill:#F1F3F5;stroke:#868E96;stroke-width:2}
    </style>
  </defs>
  <rect width="1680" height="1000" fill="#FFFFFF"/>
  <text x="40" y="44" style="font-size:28px;font-weight:700;fill:#1d1f23">pcx · cómo se arma (alto nivel)</text>
  <text x="40" y="74" class="s">cámara → motor local → web app → proyector · los agentes controlan todo por MCP</text>

  <!-- Nube -->
  <rect x="300" y="110" width="1080" height="180" rx="14" fill="#F8F9FA" stroke="#495057" stroke-width="2"/>
  <text x="320" y="140" class="h">NUBE</text>
  <rect x="360" y="160" width="300" height="100" rx="10" class="manu"/>
  <text x="510" y="200" text-anchor="middle" class="b">Landing</text>
  <text x="510" y="230" text-anchor="middle" class="t">link de setup + descarga</text>
  <rect x="980" y="150" width="360" height="120" rx="10" class="daniel"/>
  <text x="1160" y="188" text-anchor="middle" class="b">Servidor</text>
  <text x="1160" y="218" text-anchor="middle" class="t">sesiones con llave · MCP</text>
  <text x="1160" y="246" text-anchor="middle" class="t">presets · compartir en vivo</text>

  <!-- Computador -->
  <rect x="300" y="350" width="1080" height="380" rx="14" fill="#FFFFFF" stroke="#495057" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="320" y="380" class="h">TU COMPUTADOR</text>
  <rect x="360" y="400" width="300" height="84" rx="42" class="manu"/>
  <text x="510" y="436" text-anchor="middle" class="b">Tu agente de IA</text>
  <text x="510" y="464" text-anchor="middle" class="t">Claude Code · Codex</text>

  <rect x="340" y="530" width="500" height="176" rx="12" fill="#FFF9F2" stroke="#E8590C" stroke-width="2.5"/>
  <text x="590" y="560" text-anchor="middle" class="b">Motor local pcx</text>
  <text x="590" y="584" text-anchor="middle" class="s">lo que se descarga · Rust · pesos incluidos</text>
  <rect x="358" y="600" width="226" height="90" rx="8" class="manu"/>
  <text x="471" y="632" text-anchor="middle" class="t">servidor local · cámara</text>
  <text x="471" y="658" text-anchor="middle" class="t">foto limpia · conexión</text>
  <rect x="600" y="600" width="222" height="90" rx="8" class="max"/>
  <text x="711" y="632" text-anchor="middle" class="t">percepción: SAM</text>
  <text x="711" y="658" text-anchor="middle" class="t">tracking · objetos</text>
  <path d="M584 645 L598 645" class="ln" marker-end="url(#a)"/>

  <rect x="1000" y="560" width="340" height="130" rx="10" class="daniel"/>
  <text x="1170" y="600" text-anchor="middle" class="b">Web app</text>
  <text x="1170" y="630" text-anchor="middle" class="t">consola + 2.ª pantalla</text>
  <text x="1170" y="658" text-anchor="middle" class="t">interfaces proyectadas (Max)</text>

  <!-- Mesa -->
  <polygon points="70,605 250,605 230,685 50,685" class="ext"/>
  <text x="150" y="652" text-anchor="middle" class="b">Cámara</text>
  <polygon points="1450,605 1630,605 1610,685 1430,685" class="ext"/>
  <text x="1530" y="652" text-anchor="middle" class="b">Proyector</text>
  <text x="150" y="590" text-anchor="middle" class="h">MESA</text>
  <text x="1530" y="590" text-anchor="middle" class="h">MESA</text>

  <!-- Flujo principal -->
  <path d="M245 645 L356 645" class="ln" marker-end="url(#a)"/>
  <text x="300" y="624" text-anchor="middle" class="lbl">video</text>
  <path d="M840 625 L998 625" class="ln" marker-end="url(#a)"/>
  <text x="919" y="606" text-anchor="middle" class="lbl">objetos y</text>
  <text x="919" y="650" text-anchor="middle" class="lbl">coordenadas</text>
  <path d="M1340 645 L1444 645" class="ln" marker-end="url(#a)"/>
  <text x="1394" y="624" text-anchor="middle" class="lbl">imagen</text>

  <!-- Bucle físico -->
  <path d="M1530 685 L1530 790 L150 790 L150 690" class="dot" marker-end="url(#a)"/>
  <rect x="610" y="776" width="460" height="28" fill="#FFFFFF"/>
  <text x="840" y="796" text-anchor="middle" class="lbl">luz sobre la mesa · la cámara ve objetos y manos</text>

  <!-- Instalación y control -->
  <path d="M510 260 L510 398" class="dot" marker-end="url(#a)"/>
  <rect x="520" y="305" width="190" height="28" fill="#FFFFFF"/>
  <text x="528" y="326" class="lbl">1 · le pasas el link</text>
  <path d="M510 484 L510 528" class="dot" marker-end="url(#a)"/>
  <text x="522" y="514" class="lbl">2 · lo instala con los modelos</text>
  <path d="M660 442 L900 442 L900 210 L978 210" class="ln" marker-end="url(#a)"/>
  <rect x="906" y="300" width="56" height="26" fill="#FFFFFF"/>
  <text x="912" y="320" class="lbl">MCP</text>
  <path d="M1170 558 L1170 272" class="ln" marker-end="url(#a)" marker-start="url(#as)"/>
  <rect x="1180" y="400" width="70" height="26" fill="#FFFFFF"/>
  <text x="1186" y="420" class="lbl">sesión</text>

  <!-- Leyenda -->
  <text x="40" y="866" class="h">QUIÉN</text>
  <rect x="40" y="884" width="390" height="76" rx="8" class="manu"/>
  <text x="56" y="914" class="b" style="font-size:19px">Manu · unir todo</text>
  <text x="56" y="942" class="s">motor local, conexión, instalación</text>
  <rect x="446" y="884" width="380" height="76" rx="8" class="daniel"/>
  <text x="462" y="914" class="b" style="font-size:19px">Daniel · web y servidores</text>
  <text x="462" y="942" class="s">web app, sesiones, gateway, deploy</text>
  <rect x="842" y="884" width="390" height="76" rx="8" class="max"/>
  <text x="858" y="914" class="b" style="font-size:19px">Max · modelos y tracking</text>
  <text x="858" y="942" class="s">SAM, seguimiento, interfaces proyectadas</text>
  <rect x="1248" y="884" width="392" height="76" rx="8" class="pm"/>
  <text x="1264" y="914" class="b" style="font-size:19px">Pablo y Matilda · presets</text>
  <text x="1264" y="942" class="s">clase, lab, escritorio · guion de la demo</text>
</svg>
