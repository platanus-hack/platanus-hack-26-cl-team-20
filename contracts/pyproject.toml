[project]
name = "pcx-contracts"
version = "0.2.0"
description = "Contratos de pcx: fuente única de verdad de mensajes, comandos, eventos y tools MCP."
requires-python = ">=3.12"
dependencies = ["msgspec>=0.19"]

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcx_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
