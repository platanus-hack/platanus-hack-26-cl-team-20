name: Gateway checks

on:
  push:
    branches: [main]
    paths:
      - cloud/gateway/**
      - contracts/src/**
      - contracts/pyproject.toml
      - .dockerignore
      - render.yaml
      - .github/workflows/gateway.yml
  pull_request:
    paths:
      - cloud/gateway/**
      - contracts/src/**
      - contracts/pyproject.toml
      - .dockerignore
      - render.yaml
      - .github/workflows/gateway.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
          python-version: "3.12"
          enable-cache: false
      - run: uv run --frozen pytest
