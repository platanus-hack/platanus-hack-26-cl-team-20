[project]
name = "escena-laboratorio"
version = "0.1.0"
description = "WUI · escena Laboratorio: percepción (pastillero 7x4, nivel del vaso) y conductor del protocolo"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "pyyaml>=6,<7",
  "httpx>=0.27,<1",  # solo para Jev (engine/playground/jev.py), opcional en la práctica
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["percepcion/tests", "tests"]
pythonpath = ["."]
