<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escena 3D en vivo</title>
  <meta name="description" content="Visor 3D del Live Mapping Playground: escaneo del escritorio, objetos segmentados, frustum del proyector y lienzo en vivo.">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {"imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }}
  </script>
</head>
<body>
  <main class="stage">
    <canvas id="view" aria-label="Vista 3D de la escena"></canvas>
    <div id="boot" class="boot">Cargando Three.js y la escena…</div>
    <div id="chip" class="chip" hidden></div>
    <div id="cursor" class="cursor mono" hidden></div>
  </main>

  <aside class="panel">
    <header class="head">
      <div>
        <h1>Escena 3D</h1>
        <a href="registered.html">Escena métrica registrada</a>
        <p id="source" class="muted mono">—</p>
      </div>
      <span id="badge" class="badge">…</span>
    </header>

    <section class="tiles" aria-label="Rendimiento">
      <div class="tile"><span id="fps" class="num mono">–</span><span class="lbl">fps visor</span></div>
      <div class="tile"><span id="hz" class="num mono">–</span><span class="lbl">Hz lienzo</span></div>
      <div class="tile"><span id="rtfps" class="num mono">–</span><span class="lbl">fps runtime</span></div>
    </section>

    <section class="controls" aria-label="Controles">
      <label class="row">
        <input id="live" type="checkbox" checked>
        <span>Lienzo del proyector en vivo</span>
      </label>
      <label class="slider">
        <span>Intensidad del lienzo</span>
        <input id="overlay" type="range" min="0" max="2" step="0.05" value="1">
        <output for="overlay" class="mono">1.00</output>
      </label>
      <label class="slider">
        <span>Luz de sala</span>
        <input id="room" type="range" min="0" max="1.5" step="0.05" value="1">
        <output for="room" class="mono">1.00</output>
      </label>
      <label class="slider">
        <span>Relieve ×</span>
        <input id="exag" type="range" min="0" max="4" step="0.1" value="1">
        <output for="exag" class="mono">1.0</output>
      </label>
      <div class="seg" role="radiogroup" aria-label="Objetos">
        <button data-mode="solid" class="on">Sólidos</button>
        <button data-mode="outline">Contornos</button>
        <button data-mode="off">Ocultos</button>
      </div>
      <div class="checks">
        <label class="row"><input id="frustum" type="checkbox" checked><span>Frustum</span></label>
        <label class="row"><input id="wire" type="checkbox"><span>Malla</span></label>
      </div>
      <div class="buttons">
        <button id="viewAll">Vista general</button>
        <button id="viewProj">Vista del proyector</button>
        <button id="reload">Recargar</button>
      </div>
    </section>

    <section class="block">
      <h2>Objetos <span id="nobj" class="muted mono"></span></h2>
      <ul id="objects" class="objects"></ul>
    </section>

    <section class="block">
      <h2>Eventos <span id="sse" class="dot" title="SSE"></span><span id="sseText" class="muted"></span></h2>
      <ol id="events" class="events mono"></ol>
    </section>
  </aside>

  <script type="module" src="app.js"></script>
  <script>
    // si el módulo no arranca (CDN caído, error de sintaxis), que se vea en vez de una pantalla negra
    window.addEventListener('error', (e) => {
      const b = document.getElementById('boot');
      if (b && !window.__visorListo) { b.textContent = 'No arrancó el visor: ' + (e.message || 'error al cargar un módulo'); b.classList.add('err'); }
    }, true);
  </script>
</body>
</html>
