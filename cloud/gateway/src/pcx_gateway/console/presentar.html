<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>WUI · presentación</title>
    <link rel="preload" href="/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/style.css" />
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--mesa);
      }
      #escenario {
        position: fixed;
        inset: 0;
        cursor: pointer;
        user-select: none;
      }
      :fullscreen #escenario {
        cursor: none;
      }
      #vivo,
      #lamina,
      #tapa {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #vivo {
        background: #000;
        pointer-events: none;
      }
      #vivo[data-off] {
        visibility: hidden;
      }
      /* Lámina: tipografía grande, alineada a la izquierda, con el aire de una lámina de corte. */
      #lamina {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-content: center;
        gap: 4vh 5vw;
        padding: 9vh 7vw 12vh;
        background: var(--mesa);
      }
      #lamina[hidden] {
        display: none;
      }
      #lamina.con-medio {
        grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
        align-items: center;
      }
      #lamina.solo-medio {
        grid-template-rows: auto minmax(0, 1fr);
        align-content: stretch;
      }
      #lamina h1 {
        margin: 0;
        max-width: 16ch;
        font: 640 clamp(2.2rem, 6.2vw, 8rem) / 0.98 var(--sans);
        font-stretch: 116%;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }
      #lamina.con-medio h1,
      #lamina.con-texto h1 {
        font-size: clamp(1.9rem, 4.4vw, 5.6rem);
      }
      #lamina.solo-medio h1 {
        max-width: none;
        font-size: clamp(1.6rem, 3.2vw, 4rem);
      }
      .cuerpo {
        margin-top: 4vh;
        max-width: 34ch;
        font-size: clamp(1.1rem, 2.1vw, 2.6rem);
        line-height: 1.28;
        color: var(--luz-2);
      }
      .cuerpo:first-child {
        margin-top: 0;
      }
      .cuerpo p {
        margin: 0 0 0.7em;
      }
      .cuerpo ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .cuerpo li {
        position: relative;
        padding-left: 1.3em;
        margin-bottom: 0.45em;
      }
      .cuerpo li::before {
        content: "";
        position: absolute;
        left: 0.1em;
        top: 0.5em;
        width: 0.42em;
        height: 0.42em;
        background: var(--senal);
      }
      .cuerpo strong {
        color: var(--luz);
        font-weight: 640;
      }
      .medio {
        min-width: 0;
        min-height: 0;
        height: 100%;
        max-height: 76vh;
        display: grid;
        place-items: center;
      }
      .medio img {
        display: block;
        max-width: 100%;
        max-height: 76vh;
        object-fit: contain;
      }
      .medio iframe {
        width: 100%;
        height: 100%;
        min-height: 56vh;
        border: 0;
        background: none;
      }
      #rotulo {
        position: absolute;
        left: 3vw;
        top: 4vh;
        display: flex;
        align-items: center;
        gap: 0.8em;
        padding: 0.55em 1em;
        background: color-mix(in srgb, var(--mesa) 82%, transparent);
        font: 600 clamp(1rem, 1.7vw, 2rem) var(--sans);
        font-stretch: 110%;
      }
      #rotulo[hidden] {
        display: none;
      }
      #rotulo i {
        width: 0.6em;
        height: 0.6em;
        border-radius: 50%;
        background: var(--senal);
      }
      #rotulo small {
        font: 400 0.55em var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--luz-2);
      }
      #pie {
        position: absolute;
        inset: auto 3vw 3.2vh 3vw;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font: 400 clamp(0.7rem, 0.95vw, 1rem) var(--mono);
        color: var(--luz-3);
        pointer-events: none;
      }
      #pie b {
        font: 800 1.25em var(--sans);
        font-stretch: 115%;
        color: var(--luz-2);
      }
      #avance {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 3px;
        background: var(--senal);
        transition: width 0.35s cubic-bezier(0.2, 0.7, 0.1, 1);
      }
      #aviso {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        padding: 8vw;
        text-align: center;
        background: var(--mesa);
        cursor: default;
      }
      #aviso[hidden] {
        display: none;
      }
      #aviso h1 {
        margin: 0;
        font: 640 clamp(1.6rem, 3.4vw, 3.4rem) / 1.05 var(--sans);
        font-stretch: 112%;
        letter-spacing: -0.02em;
      }
      #aviso p {
        margin: 0;
        color: var(--luz-2);
      }
      #ayuda {
        position: absolute;
        left: 50%;
        bottom: 7vh;
        transform: translateX(-50%);
        padding: 8px 16px;
        border: 1px solid var(--linea);
        background: var(--mesa-2);
        font: 400 0.72rem var(--mono);
        color: var(--luz-2);
        white-space: nowrap;
        transition: opacity 0.6s;
        pointer-events: none;
      }
      #ayuda.ido {
        opacity: 0;
      }
      @media (max-width: 760px) {
        #lamina.con-medio {
          grid-template-columns: minmax(0, 1fr);
          align-content: center;
        }
        .medio,
        .medio img {
          max-height: 38vh;
        }
        .medio iframe {
          min-height: 34vh;
        }
        #ayuda {
          white-space: normal;
          width: 80vw;
          text-align: center;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #avance {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="escenario">
      <iframe id="vivo" data-off title="La mesa en vivo" tabindex="-1"></iframe>
      <article id="lamina" hidden></article>
      <div id="rotulo" hidden><i></i><span></span><small>en vivo</small></div>
      <div id="tapa"></div>
      <div id="pie"><b>WUI</b><span id="cuenta"></span></div>
      <div id="avance" style="width: 0"></div>
      <div id="aviso"><h1 id="aviso-titulo">Conectando…</h1><p id="aviso-texto"></p></div>
      <div id="ayuda">→ o clic: siguiente · ←: anterior · F: pantalla completa</div>
    </div>
    <script type="module" src="/presentar.js"></script>
  </body>
</html>
