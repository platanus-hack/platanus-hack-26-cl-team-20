# Render Blueprint de pcx (gateway en la nube). Referencia: https://render.com/docs/blueprint-spec
# Una instancia y un worker: los WSS de los nodos y las tool calls pendientes viven en ese proceso.
# Los tres tokens los genera Render (generateValue): nadie los tipea ni quedan en el repo.
services:
  - type: web
    name: pcx-gateway
    runtime: docker
    branch: main
    autoDeployTrigger: checksPass # despliega solo si la CI de main pasa
    region: virginia
    plan: free               # temporal sin tarjeta: se duerme tras 15 min sin tráfico; volver a starter cuando llegue el crédito
    numInstances: 1          # sin autoscaling: el estado de conexiones es local al proceso
    healthCheckPath: /health # 503 si la DB no responde
    buildFilter:
      paths: [cloud/gateway/**, contracts/src/**, contracts/pyproject.toml, .dockerignore, render.yaml]
    dockerContext: .
    dockerfilePath: cloud/gateway/Dockerfile
    # __main__ fija PORT, ws_max_size (8 MiB), un worker y cierre gracioso de 20 s (WSS → 1012, el nodo reconecta).
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pcx-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pcx-events
          property: connectionString
      - key: PCX_USER_TOKEN      # MCP (agentes)
        generateValue: true
      - key: PCX_NODE_TOKEN      # WSS del nodo y subida de miniaturas
        generateValue: true
      - key: PCX_CONSOLE_TOKEN   # personas: aprobar confirmaciones de domótica; nunca a un agente
        generateValue: true
      - key: PCX_OPEN_SESSIONS   # consola web en /: cada visita crea su propio usuario + espacio + nodo
        value: "1"
      - key: PCX_NODE_ID
        value: demo-node
      - key: PCX_SPACE_ID
        value: demo-space
      - key: PCX_USER_ID
        value: demo-user
      - key: PCX_RETENTION_DAYS
        value: "30"
  - type: keyvalue
    name: pcx-events
    region: virginia
    plan: free               # temporal: en memoria
    ipAllowList: []          # solo red privada de Render
    maxmemoryPolicy: noeviction
databases:
  - name: pcx-db
    region: virginia
    plan: free               # temporal: expira a los 30 días
    postgresMajorVersion: "16"
    databaseName: pcx
    user: pcx
    ipAllowList: []          # solo red privada de Render
