[package]
name = "pcx-shm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Anillo de cuadros en memoria compartida (pcx.cam.<id>): un escritor, muchos lectores, el último gana. Mismo layout que node/capture (Python)."
publish = false

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Memory"] }
