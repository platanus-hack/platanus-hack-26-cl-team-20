[package]
name = "pcx-capture"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "pcx · captura: fuentes de cámara (uvc, replay, mjpeg, phone) → anillo pcx-shm + FrameMeta."
publish = false

[features]
default = ["zmq"]
zmq = ["dep:zeromq"]
uvc = ["dep:nokhwa"]

[dependencies]
pcx-contracts = { path = "../../../contracts/rust/pcx-contracts" }
pcx-shm = { path = "../pcx-shm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
futures-util = "0.3"
bytes = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
clap = { version = "4", features = ["derive"] }
cpu-time = "1"
zeromq = { version = "0.4", optional = true }
nokhwa = { version = "0.10", features = ["input-native"], optional = true }

# Captura nativa en macOS (AVFoundation): abre por uniqueID, 420v con el rango exacto, NV12 → RGB.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSError", "NSDictionary", "NSValue", "NSObject", "NSEnumerator"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVCaptureSession", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureVideoDataOutput", "AVMediaFormat", "AVCaptureSessionPreset", "objc2-core-media", "objc2-core-video", "dispatch2", "block2"] }
objc2-core-media = { version = "0.3", features = ["CMFormatDescription", "CMSampleBuffer", "CMTime", "CMTimeRange", "CMSync", "objc2-core-video"] }
objc2-core-video = { version = "0.3", features = ["CVBase", "CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn"] }
dispatch2 = "0.3"
block2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFString", "CFBase"] }

[dev-dependencies]
tokio-tungstenite = "0.26"
