[package]
name = "pcx-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Core del nodo pcx: actor del mundo, log de eventos (SQLite), MCP, /render, flujos, ingesta ZeroMQ, enlace a la nube y supervisor."
publish = false

[dependencies]
pcx-contracts = { path = "../../../contracts/rust/pcx-contracts" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
directories = "6"
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
bytes = "1"
png = "0.18"
rand = "0.9"
# MCP: servidor Streamable HTTP + stdio; cliente HTTP (proxy stdio → daemon y tests). Sin TLS: solo localhost.
rmcp = { version = "3.11", features = ["server", "client", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmp-serde = "1.3"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
zeromq = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
