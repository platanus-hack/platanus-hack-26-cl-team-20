[package]
name = "pcx-calib"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Calibración cámara↔proyector↔mesa de pcx: rápida (marcadores + homografía), precisa (gray code + LUT) y verificación."
publish = false

[dependencies]
pcx-contracts = { path = "../../../contracts/rust/pcx-contracts" }
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
